<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2A47"/>
      <stop offset="1" stop-color="#0F5E6E"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="218" cy="218" r="114"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- lens -->
  <circle cx="218" cy="218" r="131" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-width="34"/>
  <!-- handle -->
  <line x1="316" y1="316" x2="414" y2="414" stroke="#FFFFFF" stroke-width="54" stroke-linecap="round"/>
  <!-- healthy star curve: rise, plateau, slow decline -->
  <g clip-path="url(#lens)">
    <path d="M118 272 C 156 272, 160 182, 194 178 L 244 176 C 272 176, 284 238, 322 248"
          fill="none" stroke="#4ADE80" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M118 272 C 156 272, 160 182, 194 178 L 244 176 C 272 176, 284 238, 322 248 L 322 340 L 118 340 Z"
          fill="#4ADE80" fill-opacity="0.16"/>
  </g>
  <!-- star at the peak -->
  <path transform="translate(219 128) scale(1.15)"
        d="M0,-24 L6.9,-9.5 L22.8,-7.4 L11.2,3.6 L14.1,19.4 L0,11.8 L-14.1,19.4 L-11.2,3.6 L-22.8,-7.4 L-6.9,-9.5 Z"
        fill="#FBBF24"/>
</svg>
